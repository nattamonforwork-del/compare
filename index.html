<title>อันไหนถูกกว่า?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap');

:root{
  --bg:#F7F8FA;
  --card:#FFFFFF;
  --field:#F3F4F6;
  --ink:#111827;
  --ink-soft:#6B7280;
  --border:#E7E9EC;
  --green:#16A34A;
  --green-wash:#EEFBF1;
  --green-border:#BFE8CB;
  --red:#DC2626;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
form{margin:0;padding:0;}
body{
  background:var(--bg);
  min-height:100vh;
  font-family:'Anuphan',-apple-system,sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  padding:28px 14px 60px;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:24px 20px;
  box-shadow:0 1px 3px rgba(16,24,40,0.04), 0 12px 28px -12px rgba(16,24,40,0.08);
}

.head{ text-align:center; margin-bottom:20px; }
.title{
  font-size:22px;
  font-weight:700;
  margin:0 0 4px;
  letter-spacing:-0.01em;
}
.logo{
  height:44px;
  margin:0 auto 6px;
  display:block;
}
.subtitle{ font-size:13.5px; color:var(--ink-soft); font-weight:400; }

.types{
  display:flex;
  gap:2px;
  background:var(--field);
  border-radius:12px;
  padding:3px;
  margin-bottom:18px;
}
.type-btn{
  flex:1;
  padding:8px 4px;
  font-family:'Anuphan',sans-serif;
  font-weight:600;
  font-size:13px;
  border:none;
  border-radius:9px;
  background:transparent;
  color:var(--ink-soft);
  cursor:pointer;
  transition:0.15s;
}
.type-btn.active{
  background:var(--card);
  color:var(--ink);
  box-shadow:0 1px 2px rgba(16,24,40,0.08);
}

.sides{
  display:flex;
  gap:10px;
  margin-bottom:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-padding:0 2px;
  padding-bottom:2px;
  -ms-overflow-style:none;
  scrollbar-width:none;
}
.sides::-webkit-scrollbar{ display:none; }

.hint{
  text-align:right;
  font-size:11px;
  color:var(--ink-soft);
  margin:-6px 2px 8px;
}

.side{
  flex:0 0 calc(50% - 5px);
  scroll-snap-align:start;
  background:var(--field);
  border:1px solid transparent;
  border-radius:16px;
  padding:14px 10px;
  transition:background 0.25s, border-color 0.25s;
  position:relative;
}
.side.winner{ background:var(--green-wash); border-color:var(--green-border); }

.side-label{
  font-family:'Anuphan',sans-serif;
  font-weight:600;
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:10px;
  display:flex; justify-content:space-between; align-items:center;
  height:20px;
  line-height:1;
  overflow:visible;
}
.medal{
  font-size:11.5px; font-weight:700; color:var(--green);
  display:inline-flex; align-items:center; gap:2px;
  line-height:1; white-space:nowrap;
}
.remove-btn{
  border:none; background:none; color:var(--ink-soft);
  font-size:15px; line-height:1; cursor:pointer; padding:0 2px;
}
.remove-btn:hover{ color:var(--red); }

.field{ margin-bottom:8px; }
.field label{
  display:block; font-size:11px; color:var(--ink-soft);
  font-weight:500; margin-bottom:4px;
}
.field input, .field select{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  font-family:'Anuphan',sans-serif;
  font-size:16px;
  color:var(--ink);
  padding:8px 10px;
  outline:none;
  transition:border-color 0.15s;
  -webkit-appearance:none;
  appearance:none;
}
.field input:focus, .field select:focus{ border-color:var(--ink); }
.amt-row{ display:flex; align-items:center; gap:6px; }
.amt-row .field{ flex:1; margin-bottom:8px; }
.amt-x{ color:var(--ink-soft); font-size:13px; padding-top:16px; font-weight:600; }

.perunit{
  margin-top:6px; font-size:12px; color:var(--ink-soft); min-height:16px; font-weight:500;
}
.perunit b{ color:var(--ink); font-weight:700; }
.side.winner .perunit b{ color:var(--green); }

.add-btn{
  width:100%;
  padding:11px;
  border:1.5px dashed var(--border);
  border-radius:14px;
  background:transparent;
  color:var(--ink-soft);
  font-family:'Anuphan',sans-serif;
  font-weight:600;
  font-size:13.5px;
  cursor:pointer;
  margin-bottom:18px;
  transition:0.15s;
}
.add-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }
.add-btn:disabled{ opacity:0.4; cursor:default; }

.divider{ height:1px; background:var(--border); margin:4px 0 18px; }

.stage{ text-align:center; }
.mascot{ width:64px; height:64px; margin:0 auto 10px; }

.bubble{
  font-family:'Anuphan',sans-serif;
  font-weight:700;
  font-size:16px;
  min-height:22px;
}
.bubble.win{ color:var(--green); }
.bubble.tie{ color:var(--ink-soft); }
.bubble.empty{ color:var(--ink-soft); font-weight:500; font-size:13px; }

.pct{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; font-weight:500; }
.pct b{ color:var(--red); font-weight:700; }

.foot{
  text-align:center; font-size:11.5px; color:var(--ink-soft);
  font-weight:400; margin-top:18px;
}

@keyframes pop{
  0%{ transform:scale(0.7); opacity:0; }
  60%{ transform:scale(1.08); }
  100%{ transform:scale(1); opacity:1; }
}
.pop{ animation:pop 0.35s cubic-bezier(.2,1.4,.4,1); }

@media (prefers-reduced-motion: reduce){ .pop{ animation:none; } }
</style>
</head>

<script>
const UNIT_TYPES = {
  weight: { label:'น้ำหนัก', base:'ก.', per:100,
    units:[{key:'g',label:'กรัม (ก.)',factor:1},{key:'kg',label:'กิโลกรัม (กก.)',factor:1000}] },
  volume: { label:'ปริมาตร', base:'มล.', per:100,
    units:[{key:'ml',label:'มิลลิลิตร (มล.)',factor:1},{key:'l',label:'ลิตร (ล.)',factor:1000}] },
  count: { label:'จำนวน', base:'ชิ้น', per:1,
    units:[{key:'pcs',label:'ชิ้น / หน่วย',factor:1}] }
};

const MAX_ITEMS = 5;
let unitType = 'weight';
let nextId = 3;
let items = [
  { id:1, name:'', amount:'', qty:1, unit:'g', price:'' },
  { id:2, name:'', amount:'', qty:1, unit:'g', price:'' }
];

function unitFactor(item){
  const t = UNIT_TYPES[unitType];
  const u = t.units.find(u=>u.key===item.unit) || t.units[0];
  return u.factor;
}
function pricePerBase(item){
  const amount = parseFloat(item.amount), qty = parseFloat(item.qty), price = parseFloat(item.price);
  if(!amount || !qty || !price || amount<=0 || qty<=0 || price<=0) return null;
  return price / (amount * qty * unitFactor(item));
}
function fmt(n){ return n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function sanitizeNumeric(str){
  let v = str.replace(/[^0-9.]/g, '');
  const firstDot = v.indexOf('.');
  if(firstDot !== -1){
    v = v.slice(0, firstDot+1) + v.slice(firstDot+1).replace(/\./g, '');
  }
  return v;
}

function renderTypes(){
  const el = document.getElementById('types');
  el.innerHTML = '';
  Object.keys(UNIT_TYPES).forEach(key=>{
    const btn = document.createElement('button');
    btn.className = 'type-btn' + (key===unitType ? ' active':'');
    btn.textContent = UNIT_TYPES[key].label;
    btn.onclick = ()=>{
      unitType = key;
      const du = UNIT_TYPES[key].units[0].key;
      items.forEach(it=>it.unit = du);
      renderAll();
    };
    el.appendChild(btn);
  });
}

function renderSide(item, idx){
  const units = UNIT_TYPES[unitType].units;

  const box = document.createElement('div');
  box.className = 'side';
  box.id = 'side-'+item.id;

  const label = document.createElement('div');
  label.className = 'side-label';
  const labelLeft = document.createElement('span');
  labelLeft.textContent = 'รายการ ' + (idx+1);
  label.appendChild(labelLeft);

  const labelRight = document.createElement('span');
  labelRight.style.display = 'flex';
  labelRight.style.alignItems = 'center';
  labelRight.style.gap = '6px';
  const medal = document.createElement('span');
  medal.className = 'medal';
  medal.id = 'medal-'+item.id;
  labelRight.appendChild(medal);
  if(items.length > 2){
    const rm = document.createElement('button');
    rm.className = 'remove-btn';
    rm.textContent = '×';
    rm.onclick = ()=>{ items = items.filter(i=>i.id!==item.id); renderAll(); };
    labelRight.appendChild(rm);
  }
  label.appendChild(labelRight);
  box.appendChild(label);

  const nameField = document.createElement('div');
  nameField.className = 'field';
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.placeholder = 'สินค้าชิ้นที่ ' + (idx+1);
  nameInput.value = item.name;
  nameInput.oninput = e=>{ item.name = e.target.value; renderResults(); };
  nameField.appendChild(nameInput);
  box.appendChild(nameField);

  const amtRow = document.createElement('div');
  amtRow.className = 'amt-row';

  const amtField = document.createElement('div');
  amtField.className = 'field';
  amtField.innerHTML = '<label>ปริมาณ</label>';
  const amtInput = document.createElement('input');
  amtInput.type = 'text'; amtInput.setAttribute('inputmode','decimal'); amtInput.setAttribute('pattern','[0-9]*'); amtInput.value = item.amount;
  amtInput.oninput = e=>{
    const v = sanitizeNumeric(e.target.value);
    e.target.value = v;
    item.amount = v;
    renderResults();
  };
  amtField.appendChild(amtInput);
  amtRow.appendChild(amtField);

  const x = document.createElement('div');
  x.className = 'amt-x'; x.textContent = '×';
  amtRow.appendChild(x);

  const qtyField = document.createElement('div');
  qtyField.className = 'field';
  qtyField.innerHTML = '<label>จำนวน</label>';
  const qtyInput = document.createElement('input');
  qtyInput.type = 'text'; qtyInput.setAttribute('inputmode','decimal'); qtyInput.setAttribute('pattern','[0-9]*'); qtyInput.value = item.qty;
  qtyInput.oninput = e=>{
    const v = sanitizeNumeric(e.target.value);
    e.target.value = v;
    item.qty = v;
    renderResults();
  };
  qtyField.appendChild(qtyInput);
  amtRow.appendChild(qtyField);

  box.appendChild(amtRow);

  const unitField = document.createElement('div');
  unitField.className = 'field';
  const unitSelect = document.createElement('select');
  units.forEach(u=>{
    const opt = document.createElement('option');
    opt.value = u.key; opt.textContent = u.label;
    if(u.key === item.unit) opt.selected = true;
    unitSelect.appendChild(opt);
  });
  unitSelect.onchange = e=>{ item.unit = e.target.value; renderResults(); };
  unitField.appendChild(unitSelect);
  box.appendChild(unitField);

  const priceField = document.createElement('div');
  priceField.className = 'field';
  priceField.innerHTML = '<label>ราคา (บาท)</label>';
  const priceInput = document.createElement('input');
  priceInput.type = 'text'; priceInput.setAttribute('inputmode','decimal'); priceInput.setAttribute('pattern','[0-9]*'); priceInput.value = item.price;
  priceInput.oninput = e=>{
    const v = sanitizeNumeric(e.target.value);
    e.target.value = v;
    item.price = v;
    renderResults();
  };
  priceField.appendChild(priceInput);
  box.appendChild(priceField);

  const per = document.createElement('div');
  per.className = 'perunit';
  per.id = 'perunit-'+item.id;
  box.appendChild(per);

  return box;
}

function renderSides(){
  const el = document.getElementById('sides');
  el.innerHTML = '';
  items.forEach((item, idx)=>{
    el.appendChild(renderSide(item, idx));
  });
  document.getElementById('addBtn').disabled = items.length >= MAX_ITEMS;

  const hint = document.getElementById('hint');
  hint.style.display = items.length > 2 ? 'block' : 'none';
}

function mascotSVG(state){
  const mouth = state==='win'
    ? '<path d="M23 40 Q32 50 41 40" stroke="#111827" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
    : state==='tie'
      ? '<line x1="24" y1="41" x2="40" y2="41" stroke="#111827" stroke-width="2.6" stroke-linecap="round"/>'
      : '<path d="M25 42 Q32 39 39 42" stroke="#111827" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  const cheeks = state==='win'
    ? '<circle cx="16" cy="36" r="3.4" fill="#16A34A" opacity="0.18"/><circle cx="48" cy="36" r="3.4" fill="#16A34A" opacity="0.18"/>'
    : '';
  const browOffset = state==='win' ? -2 : 0;
  return `
  <svg viewBox="0 0 64 64" width="64" height="64">
    <circle cx="32" cy="34" r="26" fill="#F3F4F6" stroke="#111827" stroke-width="2.6"/>
    <text x="32" y="29" font-family="Anuphan, sans-serif" font-weight="700" font-size="14" fill="#111827" text-anchor="middle">฿</text>
    <circle cx="22" cy="${33+browOffset}" r="2.3" fill="#111827"/>
    <circle cx="42" cy="${33+browOffset}" r="2.3" fill="#111827"/>
    ${cheeks}
    ${mouth}
  </svg>`;
}

function renderMascot(state){
  const el = document.getElementById('mascot');
  el.innerHTML = mascotSVG(state);
  el.classList.remove('pop');
  requestAnimationFrame(()=> el.classList.add('pop'));
}

function renderResults(){
  const t = UNIT_TYPES[unitType];

  items.forEach(item=>{
    const ppb = pricePerBase(item);
    const el = document.getElementById('perunit-'+item.id);
    if(!el) return;
    if(ppb===null){
      el.innerHTML = 'กรอกให้ครบเพื่อคำนวณ';
    } else {
      const val = ppb * t.per;
      const label = t.per>1 ? ('บาท/'+t.per+t.base) : ('บาท/'+t.base);
      el.innerHTML = '→ <b>'+fmt(val)+'</b> '+label;
    }
  });

  items.forEach(item=>{
    const sideEl = document.getElementById('side-'+item.id);
    const medalEl = document.getElementById('medal-'+item.id);
    if(sideEl) sideEl.classList.remove('winner');
    if(medalEl) medalEl.textContent = '';
  });

  const bubble = document.getElementById('bubble');
  const pctEl = document.getElementById('pct');

  const valid = items
    .map(item=>({ item, ppb: pricePerBase(item) }))
    .filter(x => x.ppb !== null);

  if(valid.length < 2){
    bubble.className = 'bubble empty';
    bubble.textContent = 'กรอกข้อมูลให้ครบอย่างน้อย 2 รายการ';
    pctEl.innerHTML = '';
    renderMascot('idle');
    return;
  }

  const minVal = Math.min(...valid.map(v=>v.ppb));
  const maxVal = Math.max(...valid.map(v=>v.ppb));
  const EPS = 1e-9;
  const winners = valid.filter(v => Math.abs(v.ppb - minVal) < EPS);

  if(Math.abs(maxVal - minVal) < EPS){
    bubble.className = 'bubble tie';
    bubble.textContent = 'ราคาต่อหน่วยเท่ากันหมดเลย!';
    pctEl.innerHTML = '';
    renderMascot('tie');
    return;
  }

  winners.forEach(w=>{
    const sideEl = document.getElementById('side-'+w.item.id);
    const medalEl = document.getElementById('medal-'+w.item.id);
    if(sideEl) sideEl.classList.add('winner');
    if(medalEl) medalEl.textContent = '🏆 คุ้มสุด';
  });

  const pctDiff = ((maxVal/minVal)-1)*100;

  function displayName(item){
    const idx = items.findIndex(i=>i.id===item.id);
    return item.name || ('สินค้าชิ้นที่ ' + (idx+1));
  }

  bubble.className = 'bubble win';
  if(winners.length === 1){
    bubble.textContent = displayName(winners[0].item) + ' ถูกที่สุด!';
  } else {
    const names = winners.map(w=>displayName(w.item)).join(' และ ');
    bubble.textContent = names + ' ถูกที่สุดเท่ากัน!';
  }
  pctEl.innerHTML = 'ถูกกว่ารายการที่แพงที่สุด <b>' + fmt(pctDiff) + '%</b> ต่อหน่วย';
  renderMascot('win');
}

function renderAll(){
  renderTypes();
  renderSides();
  renderResults();
}

document.getElementById('addBtn').onclick = ()=>{
  if(items.length >= MAX_ITEMS) return;
  const defaultUnit = UNIT_TYPES[unitType].units[0].key;
  items.push({ id:nextId++, name:'', amount:'', qty:1, unit:defaultUnit, price:'' });
  renderAll();
  const el = document.getElementById('sides');
  requestAnimationFrame(()=>{ el.scrollTo({ left: el.scrollWidth, behavior:'smooth' }); });
};

renderAll();
</script>
</body>
</html>
